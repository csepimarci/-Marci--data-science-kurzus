<title id="title">European natural gas prices before and after the 2022 Ukraine invasion</title>
<desc id="description">Monthly European natural gas prices from January 2017 to December 2024, in nominal US dollars per million British thermal units. The chart marks the 24 February 2022 invasion, shows the 2021 average, and highlights the August 2022 price peak. It does not isolate the invasion's causal effect.</desc>
