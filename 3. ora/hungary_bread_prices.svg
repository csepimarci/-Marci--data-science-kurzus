<text x="673.31" y="265" text-anchor="middle" fill="#a44d39" font-family="Arial, sans-serif" font-size="12" font-weight="700">HYPERINFLATION · NO BREAD-PRICE OBSERVATIONS IN THIS SOURCE</text>
