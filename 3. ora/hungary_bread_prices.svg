<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 820">
<title id="title">Bread prices and hyperinflation in Hungary, 1939–1952</title>
<desc id="description">A timeline of nine sourced bread-price observations per kilogram in pengő before the 1946 currency reform and forint after it. A second panel shows four published general price-level multiples relative to 1938 on a logarithmic scale. No bread prices are plotted for the peak hyperinflation because the source series has no observations then.</desc>
<rect width="100%" height="100%" fill="#fbf8f1"/>
<text x="72" y="55" fill="#273b32" font-family="Arial, sans-serif" font-size="30" font-weight="700">What did bread cost in Hungary?</text>
<text x="74" y="85" fill="#5c685f" font-family="Arial, sans-serif" font-size="15">Observed retail prices before and after the 1945–46 hyperinflation</text>
<rect x="72" y="105" width="1058" height="55" rx="5" fill="#f0e6d4"/>
<text x="91" y="128" fill="#7d4a2f" font-family="Arial, sans-serif" font-size="14" font-weight="700">HYPERINFLATION PEAK · JULY 1946</text>
<text x="91" y="148" fill="#273b32" font-family="Arial, sans-serif" font-size="14">Monthly inflation reached 4.19 × 10¹⁶%; prices doubled about every 15 hours (Hanke–Krus).</text>
<text x="74" y="202" fill="#273b32" font-family="Arial, sans-serif" font-size="19" font-weight="700">Bread price observations · per kilogram</text>
<text x="74" y="224" fill="#5c685f" font-family="Arial, sans-serif" font-size="13">Timeline only: pengő before the currency change; forint after. Amounts across currencies are not directly comparable.</text>
