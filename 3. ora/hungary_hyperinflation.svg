<text x="78" y="690" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="12">Rates are calculated from the published price-level values between the dates shown; the July interval is 1–31 July.</text>
<text x="78" y="714" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="12">The source is a historical pengő valuation index; here it is converted to simple monthly percentage changes.</text>
<text x="78" y="738" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="12">Separate peak estimate: Hanke–Krus; billion-pengő note issue date: historical banknote table. See homework for sources and limits.</text>
