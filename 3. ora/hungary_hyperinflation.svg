<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1280 790">
<title id="title">Hungary’s 1946 hyperinflation and the adópengő index</title>
<desc id="description">Eight published adópengő index observations from January 1 to July 31, 1946, rising from 1 to 2 times 10 to the 21st. The vertical axis is logarithmic. A separate note reports the Cato Institute's peak monthly price-inflation estimate. The line connects the eight reported observations and does not show daily values.</desc>
<rect width="100%" height="100%" fill="#172b4d"/>
<text x="78" y="57" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Hungary’s 1946 hyperinflation</text>
<text x="80" y="88" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="15">Adópengő index · eight reported dates · logarithmic scale</text>
<rect x="78" y="112" width="1060" height="75" rx="4" fill="#20395f"/>
<text x="98" y="141" fill="#ff8a75" font-family="Arial, sans-serif" font-size="13" font-weight="700">SEPARATE MEASURE · JULY 1946 PEAK MONTHLY INFLATION</text>
<text x="98" y="168" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="17">4.19 × 10¹⁶% · prices doubled in about 15 hours (Hanke–Krus)</text>
<text x="878.62" y="216" text-anchor="end" fill="#b39ddb" font-family="Arial, sans-serif" font-size="13" font-weight="700">1 JUNE 1946</text>
<text x="878.62" y="238" text-anchor="end" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="15">160,000</text>
