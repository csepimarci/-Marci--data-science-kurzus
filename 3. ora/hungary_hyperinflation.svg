<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1280 800">
<title id="title">Hungary’s monthly inflation during the 1946 hyperinflation</title>
<desc id="description">A logarithmic chart of the inflation rate calculated between seven consecutive published price-index dates from January through July 1946. It highlights the period from 13 May 1946, when a one-billion-pengő banknote was first issued, through the end of July. Monthly data before January 1946 is not included.</desc>
<rect width="100%" height="100%" fill="#172b4d"/>
<text x="78" y="57" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Hungary’s hyperinflation, month by month</text>
<text x="80" y="88" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="15">Monthly inflation implied by published index changes · logarithmic scale</text>
<rect x="78" y="111" width="1060" height="77" rx="4" fill="#20395f"/>
<text x="98" y="141" fill="#ff8a75" font-family="Arial, sans-serif" font-size="13" font-weight="700">THE CATASTROPHIC PEAK · JULY 1946</text>
<text x="98" y="168" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="16">Separate published estimate: 4.19 × 10¹⁶% monthly; prices doubled in about 15 hours.</text>
<text x="80" y="230" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="13">Hyperinflation: August 1945–July 1946 · monthly source observations begin in January 1946.</text>
