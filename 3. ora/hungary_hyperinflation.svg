<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1280 820">
<title id="title">Hungary’s prices before, during, and after hyperinflation</title>
<desc id="description">Two separate logarithmic charts. The left shows historical price-level multiples relative to 1938 from 1938 through July 1946, including the hyperinflation. The right shows Hungary's annual consumer price index in the forint era, 1972–2025, with 2010 equal to 100. The series use different bases and are not connected.</desc>
<rect width="100%" height="100%" fill="#172b4d"/>
<text x="78" y="57" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Hungary’s prices before and after the crisis</text>
<text x="80" y="88" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="15">Prewar benchmark · 1945–46 catastrophe · prices in the forint era</text>
<rect x="78" y="111" width="1120" height="81" rx="4" fill="#20395f"/>
<text x="98" y="141" fill="#ff8a75" font-family="Arial, sans-serif" font-size="13" font-weight="700">THE BREAK</text>
<text x="98" y="168" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="15">At the July peak, prices doubled about every 15 hours. The forint replaced the pengő on 1 August 1946.</text>
