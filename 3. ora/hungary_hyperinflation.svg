<text x="1200" y="216" text-anchor="end" fill="#ff8a75" font-family="Arial, sans-serif" font-size="13" font-weight="700">31 JULY 1946</text>
<text x="1200" y="238" text-anchor="end" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="15">2 × 10²¹</text>
