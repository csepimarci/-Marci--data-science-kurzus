<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1200 770">
<title id="title">Hungary’s 1946 hyperinflation and the adópengő index</title>
<desc id="description">Eight published adópengő index observations from January 1 to July 31, 1946. The vertical axis is logarithmic. The index rises from 1 to 2 times 10 to the 21st. A separate note reports the Cato Institute's peak monthly price-inflation estimate.</desc>
<rect width="100%" height="100%" fill="#281923"/>
<text x="76" y="55" fill="#fff2ea" font-family="Arial, sans-serif" font-size="29" font-weight="700">Hungary’s 1946 hyperinflation</text>
<text x="78" y="87" fill="#e4cbd0" font-family="Arial, sans-serif" font-size="15">The adópengő index · eight published dates · logarithmic scale</text>
<rect x="78" y="112" width="1060" height="78" rx="4" fill="#3d2631"/>
<text x="98" y="143" fill="#ffad83" font-family="Arial, sans-serif" font-size="14" font-weight="700">SEPARATE PRICE-INFLATION MEASURE · JULY 1946</text>
<text x="98" y="169" fill="#fff2ea" font-family="Arial, sans-serif" font-size="17">Hanke–Krus report a peak monthly inflation rate of 4.19 × 10¹⁶% (prices doubling in about 15 hours).</text>
