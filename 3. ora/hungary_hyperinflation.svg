<text x="1033.31" y="443.68" text-anchor="end" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="13" font-weight="700">1 Jul · 7.5 billion</text>
<text x="78" y="704" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="13">Adópengő index (pengős per adópengő), as reported in the source table.</text>
<text x="78" y="729" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="12">Dots are the eight published observations. The connecting line is a visual guide, not daily data.</text>
<text x="78" y="754" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="12">Sources: Garami, Pénzportál (via the Hungarian adópengő table); Hanke–Krus, World Hyperinflations.</text>
