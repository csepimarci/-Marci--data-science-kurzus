<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1280 780">
<title id="title">Two shocks, two recoveries: U.S. airline travel</title>
<desc id="description">Monthly seasonally adjusted U.S. scheduled passenger-flight revenue passenger-miles from 2000 through July 2026. A 29.5 percent decline between August and September 2001 and a 96.7 percent decline between February and April 2020 are highlighted.</desc>
<rect width="100%" height="100%" fill="#f5f8fb"/>
<text x="70" y="58" fill="#152b3c" font-family="Arial, sans-serif" font-size="34" font-weight="700">Two shocks, two recoveries</text>
<text x="72" y="91" fill="#526778" font-family="Arial, sans-serif" font-size="17">U.S. airline passenger travel fell after 9/11 — then collapsed further during COVID-19</text>
