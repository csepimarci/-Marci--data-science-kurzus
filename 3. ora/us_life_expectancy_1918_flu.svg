<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1280 790">
<title id="title">The 1918 flu pandemic and U.S. life expectancy</title>
<desc id="description">Annual U.S. life expectancy at birth from 1900 to 2018. It falls from 50.9 years in 1917 to 39.1 in 1918, then rebounds to 54.7 in 1919.</desc>
<rect width="100%" height="100%" fill="#111114"/>
<text x="76" y="55" fill="#fff5f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">The year life expectancy fell 11.8 years</text>
<text x="78" y="87" fill="#d2c9cb" font-family="Arial, sans-serif" font-size="15">U.S. life expectancy at birth · CDC/NCHS · 1900–2018</text>
<text x="80" y="139" fill="#ff6574" font-family="Arial, sans-serif" font-size="13" font-weight="700">1917 · BEFORE</text>
<text x="80" y="174" fill="#fff5f5" font-family="Arial, sans-serif" font-size="27" font-weight="700">50.9 years</text>
<text x="399" y="139" fill="#ff6574" font-family="Arial, sans-serif" font-size="13" font-weight="700">1918 · PANDEMIC YEAR</text>
<text x="399" y="174" fill="#fff5f5" font-family="Arial, sans-serif" font-size="27" font-weight="700">39.1 years</text>
<text x="399" y="198" fill="#ff6574" font-family="Arial, sans-serif" font-size="14">−11.8 years (-23.2%)</text>
<text x="764" y="139" fill="#ff6574" font-family="Arial, sans-serif" font-size="13" font-weight="700">1919 · REBOUND</text>
<text x="764" y="174" fill="#fff5f5" font-family="Arial, sans-serif" font-size="27" font-weight="700">54.7 years</text>
<text x="764" y="198" fill="#d2c9cb" font-family="Arial, sans-serif" font-size="14">+15.6 from 1918</text>
<text x="1060" y="139" fill="#ff6574" font-family="Arial, sans-serif" font-size="13" font-weight="700">ONE-YEAR SNAPSHOT</text>
<text x="1060" y="174" fill="#fff5f5" font-family="Arial, sans-serif" font-size="16" font-weight="700">Not a lifespan forecast</text>
