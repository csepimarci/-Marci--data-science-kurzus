<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1280 800">
<title id="title">Brent crude oil prices before and after Russia invaded Ukraine</title>
<desc id="description">Monthly average Brent crude oil price from January 2017 to September 2026, in nominal US dollars per barrel. A vertical marker shows Russia's full-scale invasion of Ukraine on 24 February 2022. Prices rose from January to March 2022 and reached a later peak in June 2022. The chart does not attribute all price changes to the invasion.</desc>
