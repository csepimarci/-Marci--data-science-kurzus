<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1500 1020">
<title id="title">EV adoption rose after purchase incentives changed</title>
<desc id="description">Three country line charts compare the gradual early rise in electric-car sales shares with larger rises after purchase-incentive changes in 2020. Germany, China and France are shown. The timing is suggestive, not proof that the policies caused the increases.</desc>
<rect width="100%" height="100%" fill="#172b4d"/>
<text x="76" y="54" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Flat… policy change… then the EV share climbs</text>
<text x="78" y="85" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="15">Selected cases where adoption accelerated after a purchase-incentive change · new passenger-car sales, 2015–2025</text>
<text x="78" y="115" fill="#ffcc80" font-family="Arial, sans-serif" font-size="13" font-weight="700">Policy timing is a clue, not proof of cause; 2020 annual data also include wider pandemic-era changes.</text>
