<text x="533" y="802" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="13">Purchase-tax exemption extended</text>
<text x="533" y="824" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="13">through 2027 for new-energy vehicles.</text>
<rect x="952" y="750" width="390" height="108" rx="9" fill="#20395f" stroke="#395174" stroke-width="1"/>
