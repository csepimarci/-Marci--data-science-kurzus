<text x="96" y="824" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="13">ended after the 2022 transition.</text>
<rect x="515" y="750" width="390" height="108" rx="9" fill="#20395f" stroke="#395174" stroke-width="1"/>
