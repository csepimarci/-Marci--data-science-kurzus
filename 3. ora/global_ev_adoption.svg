<text x="970" y="802" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="13">VAT relief narrowed: the exemption</text>
<text x="970" y="824" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="13">was capped at the first NOK 500,000.</text>
<text x="80" y="902" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="12">Source: IEA Global EV Data Explorer, Global EV Outlook 2026. Sales share is not the share of the vehicle fleet.</text>
