<text x="533" y="649" fill="#9ad29a" font-family="Arial, sans-serif" font-size="12" font-weight="700">2018 · SWEDEN</text>
<text x="533" y="676" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="13">Bonus-malus system introduced a bonus</text>
<text x="533" y="698" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="13">for eligible low-emission cars.</text>
<rect x="952" y="624" width="390" height="108" rx="9" fill="#20395f" stroke="#395174" stroke-width="1"/>
