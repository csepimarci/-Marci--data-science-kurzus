<text x="970" y="649" fill="#9ad29a" font-family="Arial, sans-serif" font-size="12" font-weight="700">2022 · SWEDEN</text>
<text x="970" y="676" fill="#f1f4f8" font-family="Arial, sans-serif" font-size="13">Climate bonus ended from 8 November;</text>
<text x="970" y="698" fill="#c3cfdd" font-family="Arial, sans-serif" font-size="13">the incentive was withdrawn.</text>
<rect x="78" y="750" width="390" height="108" rx="9" fill="#20395f" stroke="#395174" stroke-width="1"/>
