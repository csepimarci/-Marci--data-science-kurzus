<title id="title">Electric-car adoption leaders and selected subsidy milestones</title>
<desc id="description">Annual electric-vehicle shares of new passenger-car sales from 2010 to 2025. The lines compare the eight highest-share countries in the latest year with the world average. A lower panel lists selected subsidy and purchase-tax policy milestones; it does not establish causation.</desc>
